# FarmConnect v2 - mprocs Configuration
# Run all development services with: mprocs
# https://github.com/pvolok/mprocs

procs:
  # Backend API Server
  backend:
    cwd: backend
    shell: npm run dev

  # Admin Dashboard
  admin:
    cwd: admin-dashboard
    shell: npm run dev

  # ngrok Tunnel for Webhooks
  ngrok:
    cwd: backend
    shell: ngrok http 3000 --log=stdout

  # Mobile App (Expo)
  mobile:
    cwd: mobile
    shell: EXPO_USE_METRO_WORKSPACE_ROOT=1 EXPO_ROUTER_APP_ROOT=app npx expo start --clear

