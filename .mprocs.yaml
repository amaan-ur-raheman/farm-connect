# FarmConnect v2 - mprocs Configuration
# Run all development services with: mprocs
# https://github.com/pvolok/mprocs

procs:
  # Backend API Server
  backend:
    cwd: backend
    shell: npm run dev
    color: blue
    restart: on_failure
    restart_delay: 2000
    env:
      NODE_ENV: development
      PORT: 3000

  # ngrok Tunnel for Webhooks
  ngrok:
    cwd: backend
    shell: ngrok http 3000 --log=stdout
    color: green
    restart: on_failure

  # Mobile App (Expo)
  mobile:
    cwd: mobile
    shell: npm start
    color: yellow
